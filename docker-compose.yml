# Defines the three services (frontend, backend, database) so `docker compose up` starts everything together.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    volumes:
      - db-data:/var/lib/postgresql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin@db:5432/db
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
